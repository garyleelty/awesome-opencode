name: agentledger
repo: https://github.com/garyleelty/agentledger
tagline: Local-first cost ledger — what your coding agents really cost in tokens and money
description: Reads the session logs OpenCode, Claude Code, Codex, Kilo, DSH, OpenClaw, pi-agent, Cherry Studio, Gemini CLI and CodeBuddy CN already leave on disk and turns them into token and dollar totals. Prices cache reads and cache writes at their own rates instead of counting them as input, bills reasoning tokens as output, and prices the OpenClaw lanes that ccusage shows at $0.00. Attributes spend by project/branch/model, detects context churn, and reports billing blocks with a burn rate. Zero dependencies, no network calls — your entire coding history never leaves the machine.
